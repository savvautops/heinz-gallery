<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heinz Schielmann — Archive Gallery</title>
<style>
  :root { --bg:#0d0d10; --fg:#e8e8ea; --dim:#8a8a93; --acc:#e05656; --chip:#1c1c22; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(13,13,16,.94); backdrop-filter:blur(8px);
           padding:12px 16px; border-bottom:1px solid #222; }
  header h1 { font-size:17px; font-weight:650; }
  header p { color:var(--dim); font-size:12px; margin-top:2px; }
  #search { width:100%; margin-top:10px; padding:10px 12px; border-radius:10px; border:1px solid #2c2c34;
            background:#16161b; color:var(--fg); font-size:14px; }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:12px 16px; scrollbar-width:none; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:7px 13px; border-radius:999px; background:var(--chip); color:var(--dim);
          font-size:12.5px; border:1px solid #2a2a32; cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .chip .n { opacity:.65; font-size:11px; margin-left:4px; }
  #grid { columns:2; column-gap:8px; padding:0 8px 40px; }
  @media(min-width:700px){ #grid{ columns:4; } }
  @media(min-width:1200px){ #grid{ columns:6; } }
  .card { break-inside:avoid; margin-bottom:8px; border-radius:8px; overflow:hidden; background:#15151a;
          cursor:pointer; position:relative; }
  .card img { width:100%; display:block; }
  .card .tag { position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.62); color:#fff;
               font-size:10.5px; padding:3px 8px; border-radius:6px; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; z-index:50;
              align-items:center; justify-content:center; flex-direction:column; padding:16px; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:100%; max-height:72vh; border-radius:10px; object-fit:contain; }
  #meta { margin-top:12px; max-width:560px; text-align:center; font-size:13px; color:var(--dim); }
  #meta .t { color:var(--acc); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  #meta .c { color:var(--fg); margin:8px 0; line-height:1.45; }
  #meta a { color:#7db8ff; }
  #close { position:absolute; top:12px; right:16px; font-size:28px; color:#fff; cursor:pointer; }
  #nav { position:absolute; top:45%; width:100%; display:flex; justify-content:space-between; padding:0 8px; }
  #nav span { font-size:34px; color:#fff; cursor:pointer; user-select:none; padding:12px; opacity:.7; }
  #empty { text-align:center; color:var(--dim); padding:60px 20px; display:none; }
</style>
</head>
<body>
<header>
  <h1>Heinz Schielmann — Archive</h1>
  <p id="count">loading…</p>
  <input id="search" type="search" placeholder="Search captions…">
</header>
<div id="chips"></div>
<div id="grid"></div>
<div id="empty">No images match.</div>

<div id="lightbox">
  <div id="close">×</div>
  <div id="nav"><span id="prev">‹</span><span id="next">›</span></div>
  <img id="lb-img" alt="">
  <div id="meta"></div>
</div>

<script>
let items=[], shown=[], theme='All', q='';
const grid=document.getElementById('grid'), chips=document.getElementById('chips');

fetch('data.json').then(r=>r.json()).then(d=>{
  items=d; buildChips(); apply();
});

function buildChips(){
  const counts={};
  items.forEach(i=>counts[i.theme]=(counts[i.theme]||0)+1);
  const order=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const mk=(name,n)=>{
    const c=document.createElement('div');
    c.className='chip'+(name===theme?' on':'');
    c.innerHTML=name+' <span class="n">'+n+'</span>';
    c.onclick=()=>{theme=name;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');apply();};
    chips.appendChild(c);
  };
  mk('All',items.length); order.forEach(([n,c])=>mk(n,c));
}

function apply(){
  shown=items.filter(i=>(theme==='All'||i.theme===theme)&&(!q||(i.caption||'').toLowerCase().includes(q)));
  document.getElementById('count').textContent=shown.length.toLocaleString()+' / '+items.length.toLocaleString()+' images';
  document.getElementById('empty').style.display=shown.length?'none':'block';
  grid.innerHTML='';
  const frag=document.createDocumentFragment();
  shown.forEach((it,idx)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML='<img loading="lazy" src="img/'+it.sc+'.jpg" alt=""><div class="tag">'+it.theme+'</div>';
    d.onclick=()=>openLb(idx);
    frag.appendChild(d);
  });
  grid.appendChild(frag);
  window.scrollTo(0,0);
}

document.getElementById('search').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();apply();});

let li=0;
const lb=document.getElementById('lightbox');
function openLb(i){ li=i; renderLb(); lb.classList.add('open'); document.body.style.overflow='hidden'; }
function renderLb(){
  const it=shown[li]; if(!it) return;
  document.getElementById('lb-img').src='img/'+it.sc+'.jpg';
  document.getElementById('meta').innerHTML=
    '<div class="t">'+it.theme+'</div>'+
    (it.caption?'<div class="c">'+escapeHtml(it.caption)+'</div>':'')+
    '<div>'+it.date+' · ♥ '+it.likes+' · 💬 '+it.comments+' · '+
    '<a href="'+it.url+'" target="_blank" rel="noopener">Instagram ↗</a></div>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('close').onclick=closeLb;
lb.onclick=e=>{if(e.target===lb)closeLb();};
function closeLb(){lb.classList.remove('open');document.body.style.overflow='';}
document.getElementById('prev').onclick=e=>{e.stopPropagation();li=(li-1+shown.length)%shown.length;renderLb();};
document.getElementById('next').onclick=e=>{e.stopPropagation();li=(li+1)%shown.length;renderLb();};
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')document.getElementById('prev').click();
  if(e.key==='ArrowRight')document.getElementById('next').click();
});
</script>
</body>
</html>
